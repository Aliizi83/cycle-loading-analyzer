[project]
name = "cyclic-loading-analyzer"
version = "0.1.0"
description = "Extract per-cycle Max/Min points from cyclic loading test data (Stress and Strain) into a formatted Excel workbook with charts."
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cyclic-loading-analyzer = "cyclic_loading_analyzer.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cyclic_loading_analyzer*"]
